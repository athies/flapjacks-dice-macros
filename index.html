<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flapjacks Dice Macros</title>
  <link rel="stylesheet" href="style.css?v=1.0.2" />
</head>
<body>
  <div class="container">
    <header>
      <h2>Flapjacks Dice Macros</h2>
      <span id="macro-count" class="badge">0 / 10</span>
    </header>

    <!-- Macro Creation Form -->
    <section id="macro-form-section" aria-label="Create Macro">
      <div class="field">
        <label for="macro-name">Macro Name</label>
        <input type="text" id="macro-name" placeholder="e.g. Sword Attack" maxlength="25" autocomplete="off" />
      </div>

      <div class="row">
        <div class="field count-col">
          <label for="dice-count">Count</label>
          <input type="number" id="dice-count" value="1" min="1" max="50" />
        </div>
        <div class="field die-col">
          <label for="dice-type">Die</label>
          <select id="dice-type">
            <option value="4">d4</option>
            <option value="6">d6</option>
            <option value="8">d8</option>
            <option value="12">d12</option>
            <option value="20" selected>d20</option>
            <option value="100">d100</option>
          </select>
        </div>
        <div class="field mod-col">
          <label for="modifier">Modifier</label>
          <input type="number" id="modifier" value="0" placeholder="+/-" />
        </div>
      </div>

      <button id="add-macro-btn" class="primary-btn">+ Save Macro</button>
    </section>

    <hr />

    <!-- Saved Macros -->
    <section aria-label="Saved Macros">
      <h3>Saved Macros</h3>
      <div id="macro-list" class="macro-list" role="list">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- Roll Output Area -->
    <section id="result-box" class="result-box empty" aria-live="polite">
      <div id="result-formula" class="result-formula">Click a macro to roll</div>
      <div id="result-breakdown" class="result-breakdown"></div>
      <div id="result-total" class="result-total">--</div>
    </section>
  </div>

  <script type="module" src="main.js?v=1.0.2"></script>
</body>
</html>
